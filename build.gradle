plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        compileOnly 'org.projectlombok:lombok:1.18.20'
        annotationProcessor 'org.projectlombok:lombok:1.18.20'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-logging'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
        runtimeOnly 'org.postgresql:postgresql'

        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }


}

tasks.named('test') {
    useJUnitPlatform()
}
task music(type: Exec) {
    dependsOn build
    commandLine 'bash', '-c', 'afplay music.mp3'
}

task history {
    dependsOn compileJava
    doLast {
        def revision = 'HEAD'
        def success = false

        while (!success && revision != '') {
            def result = exec {
                commandLine 'git', 'checkout', revision
                ignoreExitValue true
            }
            success = result.exitValue == 0
            if (!success) {
                revision = "${revision}~1"
            }
        }

        if (success) {
            exec {
                commandLine 'git', 'diff', "${revision}~1", revision
                standardOutput = new FileOutputStream("diff_output.txt")
            }
        }
    }
}