import java.nio.file.Files
import java.nio.file.Paths
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        compileOnly 'org.projectlombok:lombok:1.18.20'
        annotationProcessor 'org.projectlombok:lombok:1.18.20'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-logging'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
        runtimeOnly 'org.postgresql:postgresql'

        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }


}

tasks.named('test') {
    useJUnitPlatform()
}
task music(type: Exec) {
    dependsOn build
    commandLine 'bash', '-c', 'afplay music.mp3'
}

task history {
    doLast {
        def commits = "git rev-list --reverse HEAD".execute().text.readLines() // от старого к новому
        def lastWorking = null
        def brokenAfter = null

        println "Проверяем коммиты от самого старого к самому новому: ${commits.size()} шт."

        for (int i = commits.size() - 1; i >= 0; i--) {
            def commit = commits[i]
            println "Проверка коммита $commit"
            "git checkout $commit".execute().waitForProcessOutput(System.out, System.err)

            def result = "./gradlew clean compileJava".execute()
            result.waitFor()

            if (result.exitValue() == 0) {
                println "Успешная сборка на $commit"
                lastWorking = commit
                if (i + 1 < commits.size()) {
                    brokenAfter = commits[i + 1]
                }
                break
            } else {
                println "Сборка не удалась на $commit"
            }
        }

        if (lastWorking == null) {
            println "Ни один коммит не компилируется!"
            return
        }

        if (brokenAfter == null) {
            println "Следующий (сломанный) коммит не найден — возможно, $lastWorking это HEAD."
            return
        }

        println "Создаём diff между:"
        println "🟢 Рабочим:    $lastWorking"
        println "🔴 Сломанным:  $brokenAfter"

        def diff = "git diff $lastWorking $brokenAfter".execute().text
        def diffPath = "diff_between_commits.txt"

        Files.write(Paths.get(diffPath), diff.getBytes())
        println "Diff сохранён в $diffPath"
    }
}