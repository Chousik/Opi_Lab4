import java.nio.file.Files
import java.nio.file.Paths
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        compileOnly 'org.projectlombok:lombok:1.18.20'
        annotationProcessor 'org.projectlombok:lombok:1.18.20'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-logging'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
        runtimeOnly 'org.postgresql:postgresql'

        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.2'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }


}

tasks.named('test') {
    useJUnitPlatform()
}
task music(type: Exec) {
    dependsOn build
    commandLine 'bash', '-c', 'afplay music.mp3'
}

task history {
    doLast {
        def commits = "git rev-list --reverse HEAD".execute().text.readLines()
        def lastWorking = null

        println "🔁 Начинаем проверку ${commits.size()} коммитов..."

        for (commit in commits) {
            println "⏳ Проверка коммита $commit"
            "git checkout $commit".execute().waitForProcessOutput(System.out, System.err)

            def result = "./gradlew clean compileJava".execute()
            result.waitFor()

            if (result.exitValue() == 0) {
                println "✅ Сборка успешна на коммите: $commit"
                lastWorking = commit
                break
            } else {
                println "❌ Сборка провалилась на $commit"
            }
        }

        if (lastWorking == null) {
            println "🚨 Ни один коммит не собирается!"
            return
        }

        def index = commits.indexOf(lastWorking)
        if (index + 1 >= commits.size()) {
            println "ℹ️ Рабочий коммит — самый последний, diff не нужен."
            return
        }

        def nextCommit = commits[index + 1]
        def diff = "git diff $lastWorking $nextCommit".execute().text
        def diffPath = "diff_between_commits.txt"

        Files.write(Paths.get(diffPath), diff.getBytes())
        println "📄 Diff сохранён в $diffPath"
        println "🟢 Рабочий: $lastWorking"
        println "🔴 Сломанный: $nextCommit"
    }
}
